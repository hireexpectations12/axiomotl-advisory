<div class="contact-form-shell" data-contact-form>
  <div class="contact-fields">
    <label for="contact-name">Name (required)<input id="contact-name" name="name" type="text" maxlength="120" autocomplete="name" required /></label>
    <label for="contact-email">Email (required)<input id="contact-email" name="email" type="email" maxlength="254" autocomplete="email" required /></label>
    <label class="contact-wide" for="contact-organisation">Organisation (optional)<input id="contact-organisation" name="organisation" type="text" maxlength="160" autocomplete="organization" /></label>
    <label class="contact-wide" for="contact-message">How can we help? (required)<textarea id="contact-message" name="message" rows="5" maxlength="4000" required></textarea></label>
  </div>
  <p class="contact-form-note">Online enquiries are not available yet. Please email <a href="mailto:hello@axiomotl.com.au">hello@axiomotl.com.au</a> to get in touch.</p>
  <button class="button" type="button" data-contact-submit disabled>Online enquiries coming soon</button>
  <p class="contact-status" role="status" aria-live="polite"></p>
</div>
