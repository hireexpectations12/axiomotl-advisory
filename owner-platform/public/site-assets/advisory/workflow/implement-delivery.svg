<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Implement: turn the agreed direction into delivery</title><desc id="desc">Confirm the scope, sequence delivery, assign accountable owners, then test and prepare for transition. Evidence, risks and decisions are reviewed throughout.</desc>
<rect width="1200" height="640" rx="24" fill="#f3eff7"/>
<g font-family="Arial,sans-serif" fill="#321068"><text x="48" y="72" font-size="22" font-weight="700">03 / IMPLEMENT</text><text x="48" y="126" font-size="36" font-weight="700">Turn the agreed direction into delivery.</text></g>
<path d="M280 318H340M560 318H620M840 318H900" stroke="#227e7b" stroke-width="5"/>
<g fill="#fff" stroke="#d6c7e5" stroke-width="2"><rect x="40" y="202" width="240" height="234" rx="14"/><rect x="330" y="202" width="240" height="234" rx="14"/><rect x="620" y="202" width="240" height="234" rx="14"/><rect x="910" y="202" width="250" height="234" rx="14"/></g>
<g font-family="Arial,sans-serif" fill="#321068" font-size="23" font-weight="700"><text x="62" y="250">Confirm scope</text><text x="352" y="250">Sequence work</text><text x="642" y="250">Name owners</text><text x="932" y="250">Test readiness</text></g>
<g font-family="Arial,sans-serif" fill="#4d4260" font-size="20"><text x="62" y="300"><tspan x="62">Agreed outcomes</tspan><tspan x="62" dy="34">and requirements.</tspan><tspan x="62" dy="48">Clear acceptance</tspan><tspan x="62" dy="30">criteria.</tspan></text><text x="352" y="300"><tspan x="352">Milestones and</tspan><tspan x="352" dy="34">dependencies.</tspan><tspan x="352" dy="48">A practical plan</tspan><tspan x="352" dy="30">for delivery.</tspan></text><text x="642" y="300"><tspan x="642">Accountable people</tspan><tspan x="642" dy="34">for each action.</tspan><tspan x="642" dy="48">Decision and</tspan><tspan x="642" dy="30">escalation routes.</tspan></text><text x="932" y="300"><tspan x="932">Review evidence</tspan><tspan x="932" dy="34">against criteria.</tspan><tspan x="932" dy="48">Prepare training</tspan><tspan x="932" dy="30">and handover.</tspan></text></g>
<rect x="40" y="488" width="1120" height="100" rx="14" fill="#321068"/><g font-family="Arial,sans-serif" fill="#fff"><text x="66" y="528" font-size="22" font-weight="700">Review throughout delivery</text><text x="66" y="563" font-size="20">Keep requirements, risks, decisions and operational readiness connected.</text></g>
